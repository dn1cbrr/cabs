name: transit
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
